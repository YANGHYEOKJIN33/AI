<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수업 화면 — 자료구조로 배우는 머신러닝 알고리즘</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/viz.css">
  <link rel="stylesheet" href="./src/styles/deck.css">
</head>
<body class="deck">
  <div id="deck-root"></div>
  <noscript><p style="padding:16px; color:#fff">이 화면은 자바스크립트로 동작합니다.</p></noscript>
  <script type="module">
    import { findLesson } from './src/lessons/index.js';
    import { mountStage } from './src/deck/stage.js';
    const id = new URLSearchParams(location.search).get('l') ?? 'knn';
    const entry = findLesson(id);
    const root = document.getElementById('deck-root');
    if (!entry || !entry.ready) {
      root.innerHTML = '<p style="color:#fff; font-size:24px; padding:40px">아직 준비되지 않은 차시입니다. <a style="color:#9fc0ff" href="./index.html">수업 홈으로</a></p>';
    } else {
      const { lesson } = await entry.load();
      globalThis.__deck = mountStage(root, lesson);
      document.title = `${lesson.badge} ${lesson.title} — 수업 화면`;
    }
  </script>
</body>
</html>
